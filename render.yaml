services:
  # Backend Express REST API
  - type: web
    name: aicte-complaint-dashboard-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: DEADLINE_APPROACHING_DAYS
        value: 3
