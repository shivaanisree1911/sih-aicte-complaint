version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: aicte_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aicte_complaints
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aicte_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/aicte_complaints
      - JWT_SECRET=aicte_docker_secret_jwt_key_sentinel2026
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - DEADLINE_APPROACHING_DAYS=3
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aicte_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
